<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Events — K4 Game Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🎮</div>
      <div class="sidebar-logo-text"><h3>K4 Game Room</h3><span>by Kreate 4</span></div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section">Main</div>
      <a href="/admin/dashboard.html" class="nav-item"><span class="nav-item-icon">📊</span> Dashboard</a>
      <a href="/admin/create-event.html" class="nav-item"><span class="nav-item-icon">✨</span> Create Event</a>
      <a href="/admin/events.html" class="nav-item active"><span class="nav-item-icon">📋</span> All Events</a>
      <div class="nav-section">Account</div>
      <button class="nav-item" onclick="K4App.clearAdmin();window.location.href='/admin/login.html'">
        <span class="nav-item-icon">🚪</span> Logout
      </button>
    </nav>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <h1 class="admin-page-title">All Events</h1>
        <p class="admin-page-sub">Manage all your game room sessions</p>
      </div>
      <a href="/admin/create-event.html" class="btn btn-primary">✨ New Event</a>
    </div>
    <div class="admin-content">
      <div class="admin-card fade-in-up">
        <div class="admin-table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Room Code</th>
                <th>Celebrant</th>
                <th>Type</th>
                <th>Status</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="eventsBody">
              <tr><td colspan="6" style="text-align:center;color:rgba(255,255,255,0.2);padding:3rem">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/app.js"></script>
<script>
  function escHtml(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}

  (async()=>{
    if(!await K4App.requireAdmin()) return;
    try {
      const data = await K4App.api('/events/all');
      const events = data.data;
      const tbody = document.getElementById('eventsBody');
      if(!events.length){
        tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;color:rgba(255,255,255,0.2);padding:3rem">No events yet. <a href="/admin/create-event.html" style="color:var(--pink)">Create one!</a></td></tr>`;
        return;
      }
      tbody.innerHTML = events.map(e=>`
        <tr>
          <td><span style="font-family:var(--font-display);font-weight:900;letter-spacing:0.15em;color:var(--pink)">${e.room_code}</span></td>
          <td><span style="font-weight:600">${escHtml(e.celebrant_name)}</span></td>
          <td><span class="badge ${e.event_type==='bridal'?'badge-pink':'badge-blue'}">${e.event_type==='bridal'?'💍 Bridal':'👶 Baby'}</span></td>
          <td><span class="badge ${e.status==='active'?'badge-mint':e.status==='waiting'?'badge-yellow':'badge-purple'}">${e.status}</span></td>
          <td style="color:rgba(255,255,255,0.35);font-size:0.82rem">${new Date(e.created_at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}</td>
          <td style="display:flex;gap:0.5rem;flex-wrap:wrap">
            <a href="/admin/control.html?event=${e.id}" class="btn btn-success btn-sm">🎛️ Control</a>
            <button class="btn btn-sm" style="background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.2);color:rgba(255,100,100,0.7)" onclick="del(${e.id})">Delete</button>
          </td>
        </tr>`).join('');
    } catch(err){ K4App.toast(err.message,'error'); }
  })();

  async function del(id) {
    if(!confirm('Delete this event? Cannot be undone.')) return;
    try { await K4App.api(`/events/${id}`,{method:'DELETE'}); K4App.toast('Deleted','success'); location.reload(); }
    catch(err){ K4App.toast(err.message,'error'); }
  }
</script>
</body>
</html>
