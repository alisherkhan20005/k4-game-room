<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — K4 Game Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-body">
<div class="admin-layout">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sb-logo">
      <div class="sb-logo-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg>
      </div>
      <div><div class="sb-logo-name">K4 Game Room</div><div class="sb-logo-sub">by Kreate 4</div></div>
    </div>
    <nav class="sb-nav">
      <div class="sb-section">Main</div>
      <a href="/admin/dashboard.html" class="sb-item active">
        <svg class="sb-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Dashboard
      </a>
      <a href="/admin/create-event.html" class="sb-item">
        <svg class="sb-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        Create Event
      </a>
      <a href="/admin/events.html" class="sb-item">
        <svg class="sb-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        All Events
      </a>
      <div class="sb-section">Account</div>
      <button class="sb-item" onclick="logout()">
        <svg class="sb-item-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </nav>
    <div class="sb-footer">
      <div class="sb-user">
        <div class="sb-user-av">A</div>
        <div><div class="sb-user-name">Admin</div><div class="sb-user-role">Host Panel</div></div>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <div class="admin-page-title">Dashboard</div>
        <div class="admin-page-sub">Welcome back to K4 Game Room</div>
      </div>
      <a href="/admin/create-event.html" class="btn btn-primary">New Event</a>
    </div>
    <div class="admin-content">
      <!-- Stats -->
      <div class="stats-grid" id="statsGrid">
        <div class="stat-card"><div class="stat-icon si-pink"><svg viewBox="0 0 24 24" fill="none" stroke="#FF6B9D" stroke-width="2" stroke-linecap="round" width="20" height="20"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div><div><div class="stat-val" id="statTotal">-</div><div class="stat-lbl">Total Events</div></div></div>
        <div class="stat-card"><div class="stat-icon si-green"><svg viewBox="0 0 24 24" fill="none" stroke="#00C896" stroke-width="2" stroke-linecap="round" width="20" height="20"><polygon points="5 3 19 12 5 21 5 3"/></svg></div><div><div class="stat-val" id="statActive">-</div><div class="stat-lbl">Active Now</div></div></div>
        <div class="stat-card"><div class="stat-icon si-purple"><svg viewBox="0 0 24 24" fill="none" stroke="#9B7FD4" stroke-width="2" stroke-linecap="round" width="20" height="20"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><div><div class="stat-val" id="statBridal">-</div><div class="stat-lbl">Bridal Events</div></div></div>
        <div class="stat-card"><div class="stat-icon si-blue"><svg viewBox="0 0 24 24" fill="none" stroke="#6B9EFF" stroke-width="2" stroke-linecap="round" width="20" height="20"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div><div><div class="stat-val" id="statBaby">-</div><div class="stat-lbl">Baby Events</div></div></div>
      </div>

      <!-- Events Table -->
      <div class="admin-table-wrap">
        <div style="padding:1rem 1.25rem;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #EEF0F5">
          <div class="admin-card-title">Recent Events</div>
          <div style="display:flex;align-items:center;gap:0.875rem">
            <div class="search-input-wrap">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#9EA3AC" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input class="search-input" placeholder="Search events..." oninput="searchEvents(this.value)">
            </div>
            <a href="/admin/events.html" class="admin-card-link">View all</a>
          </div>
        </div>
        <table class="admin-table" id="eventsTable">
          <thead><tr>
            <th>Room Code</th><th>Celebrant</th><th>Type</th>
            <th>Players</th><th>Status</th><th>Actions</th>
          </tr></thead>
          <tbody id="eventsBody">
            <tr><td colspan="6" style="text-align:center;color:#9EA3AC;padding:3rem">Loading events...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="/js/app.js"></script>
<script>
  function logout() { K4App.clearAdmin(); window.location.href='/admin/login.html'; }
  function esc(s) { const d=document.createElement('div');d.textContent=s;return d.innerHTML; }

  (async () => {
    if (!await K4App.requireAdmin()) return;
    try {
      const data   = await K4App.api('/events/all');
      const events = data.data;
      document.getElementById('statTotal').textContent  = events.length;
      document.getElementById('statActive').textContent = events.filter(e=>e.status==='active').length;
      document.getElementById('statBridal').textContent = events.filter(e=>e.event_type==='bridal').length;
      document.getElementById('statBaby').textContent   = events.filter(e=>e.event_type==='baby').length;

      window._events = events;
      renderTable(events);
    } catch(err) { K4App.toast(err.message,'error'); }
  })();

  function renderTable(events) {
    const tbody = document.getElementById('eventsBody');
    if (!events.length) {
      tbody.innerHTML=`<tr><td colspan="6" style="text-align:center;color:#9EA3AC;padding:3rem">No events yet. <a href="/admin/create-event.html" style="color:var(--pink)">Create one!</a></td></tr>`;
      return;
    }
    tbody.innerHTML = events.map((e,i) => `
      <tr class="event-row" data-search="${esc(e.celebrant_name).toLowerCase()} ${e.room_code.toLowerCase()}">
        <td><span class="td-code">${e.room_code}</span></td>
        <td><span class="td-bold">${esc(e.celebrant_name)}</span></td>
        <td><span class="abadge ${e.event_type==='bridal'?'ab-pink':'ab-blue'}">${e.event_type==='bridal'?'Bridal':'Baby'}</span></td>
        <td><span id="pcount-${e.id}" style="font-size:0.78rem;color:#6B7280">Loading...</span></td>
        <td><span class="abadge ${e.status==='active'?'ab-green':e.status==='waiting'?'ab-yellow':'ab-purple'}">${e.status}</span></td>
        <td>
          <div style="display:flex;gap:0.4rem;align-items:center;flex-wrap:wrap">
            <button class="act-btn" onclick="togglePlayers(${e.id},'${esc(e.celebrant_name)}','${e.event_type}',${e.status==='finished'})">View Players</button>
            <a href="/admin/control.html?event=${e.id}"><button class="act-btn act-btn-green">Control</button></a>
            <button class="act-btn act-btn-red" onclick="deleteEvent(${e.id})">Delete</button>
          </div>
        </td>
      </tr>
      <tr id="panel-row-${e.id}"><td colspan="6" style="padding:0">
        <div class="players-panel" id="panel-${e.id}">
          <div class="pp-inner">
            <div class="pp-header">
              <div class="pp-title" id="pp-title-${e.id}">Players</div>
              <span class="abadge ab-green" id="pp-badge-${e.id}"></span>
            </div>
            <div class="pp-grid" id="pp-grid-${e.id}">
              <div style="grid-column:1/-1;text-align:center;color:#9EA3AC;font-size:0.82rem;padding:0.875rem">Loading players...</div>
            </div>
          </div>
        </div>
      </td></tr>`).join('');

    // Load player counts
    events.forEach(e => loadPlayerCount(e.id));
  }

  async function loadPlayerCount(eventId) {
    try {
      const data = await K4App.api(`/events/${eventId}/leaderboard`);
      const cnt = data.data.length;
      const el = document.getElementById(`pcount-${eventId}`);
      if (el) el.textContent = cnt ? `${cnt} player${cnt!==1?'s':''}` : 'No players';
    } catch { /* silent */ }
  }

  async function togglePlayers(eventId, name, type, finished) {
    const panel = document.getElementById(`panel-${eventId}`);
    const isOpen = panel.classList.contains('open');
    document.querySelectorAll('.players-panel.open').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.act-btn').forEach(b => { if(b.textContent==='Hide Players') b.textContent='View Players'; });
    if (isOpen) return;
    panel.classList.add('open');
    // find the button
    document.querySelectorAll('.act-btn').forEach(b => {
      if (b.onclick?.toString().includes(`togglePlayers(${eventId},`)) b.textContent='Hide Players';
    });
    try {
      const data    = await K4App.api(`/events/${eventId}/leaderboard`);
      const players = data.data;
      document.getElementById(`pp-title-${eventId}`).textContent = `Players in ${name}'s ${type==='bridal'?'Bridal':'Baby'} Shower`;
      document.getElementById(`pp-badge-${eventId}`).textContent = `${players.length} ${finished?'total':'joined'}`;
      const grid = document.getElementById(`pp-grid-${eventId}`);
      if (!players.length) { grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;color:#9EA3AC;font-size:0.82rem;padding:0.875rem">No players joined yet</div>`; return; }
      grid.innerHTML = players.map(p => `
        <div class="pp-chip">
          <div class="pp-av" style="background:${p.avatar_color||'#FF6B9D'}">${esc((p.name||'?').charAt(0).toUpperCase())}</div>
          <div>
            <div class="pp-name">${esc(p.name||'Player')}</div>
            <div class="pp-pts" style="color:${finished?'#9B7FD4':'#FF6B9D'}">${p.total_score||0} pts</div>
          </div>
        </div>`).join('');
    } catch(err) { K4App.toast(err.message,'error'); }
  }

  async function deleteEvent(id) {
    if (!confirm('Delete this event? This cannot be undone.')) return;
    try {
      await K4App.api(`/events/${id}`,{method:'DELETE'});
      K4App.toast('Event deleted','success');
      location.reload();
    } catch(err) { K4App.toast(err.message,'error'); }
  }

  function searchEvents(q) {
    document.querySelectorAll('.event-row').forEach(row => {
      const match = row.dataset.search.includes(q.toLowerCase());
      row.style.display = match ? '' : 'none';
      const next = row.nextElementSibling;
      if (next) next.style.display = match ? '' : 'none';
    });
  }
</script>
</body>
</html>
