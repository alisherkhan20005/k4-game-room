<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — K4 Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/games/games.css">
</head>
<body class="admin-body">
  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-icon">🎮</div>
      <div class="sidebar-brand">K4 Admin</div>
    </div>
    <nav class="sidebar-nav">
      <a href="/admin/dashboard.html" class="nav-link active">📊 Dashboard</a>
      <a href="/admin/create-event.html" class="nav-link">➕ New Event</a>
      <a href="/admin/events.html" class="nav-link">📋 All Events</a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn btn-sm" onclick="logout()" style="width:100%;background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2)">Logout</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <div class="admin-header">
      <div>
        <h1 class="admin-title">Dashboard</h1>
        <p class="admin-sub">Welcome back! Manage your K4 Game Room events.</p>
      </div>
      <a href="/admin/create-event.html" class="btn btn-primary">➕ New Event</a>
    </div>

    <!-- Stats -->
    <div class="stat-grid" id="statGrid">
      <div class="stat-card">
        <div class="stat-icon">🎉</div>
        <div class="stat-value" id="totalEvents">—</div>
        <div class="stat-label">Total Events</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">▶️</div>
        <div class="stat-value" id="activeEvents">—</div>
        <div class="stat-label">Active Now</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">✅</div>
        <div class="stat-value" id="finishedEvents">—</div>
        <div class="stat-label">Completed</div>
      </div>
      <div class="stat-card">
        <div class="stat-icon">⏳</div>
        <div class="stat-value" id="waitingEvents">—</div>
        <div class="stat-label">Waiting</div>
      </div>
    </div>

    <!-- Recent Events -->
    <div class="admin-card">
      <div class="admin-card-header">
        <h2 class="admin-card-title">Recent Events</h2>
        <a href="/admin/events.html" class="btn btn-sm btn-outline">View All</a>
      </div>
      <div id="recentEventsList"><div class="loading-placeholder">Loading events...</div></div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script src="/js/app.js"></script>
  <script>
    const token = localStorage.getItem('k4_admin_token');
    if (!token) window.location.href = '/admin/login.html';

    async function loadDashboard() {
      try {
        const res = await fetch('/api/events/all', {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        if (!data.success) { logout(); return; }

        const events = data.data;
        document.getElementById('totalEvents').textContent = events.length;
        document.getElementById('activeEvents').textContent = events.filter(e => e.status === 'active').length;
        document.getElementById('finishedEvents').textContent = events.filter(e => e.status === 'finished').length;
        document.getElementById('waitingEvents').textContent = events.filter(e => e.status === 'waiting').length;

        const recent = events.slice(0, 8);
        const list = document.getElementById('recentEventsList');

        if (recent.length === 0) {
          list.innerHTML = `<div style="text-align:center;padding:3rem;color:var(--gray)">
            <div style="font-size:3rem;margin-bottom:1rem">🎉</div>
            <p>No events yet. Create your first one!</p>
            <a href="/admin/create-event.html" class="btn btn-primary" style="margin-top:1rem;display:inline-flex">Create Event</a>
          </div>`;
          return;
        }

        list.innerHTML = `<table class="admin-table">
          <thead><tr>
            <th>Celebrant</th><th>Type</th><th>Room Code</th><th>Status</th><th>Created</th><th>Actions</th>
          </tr></thead>
          <tbody>
          ${recent.map(ev => `
            <tr>
              <td><strong>${escHtml(ev.celebrant_name)}</strong></td>
              <td><span class="badge ${ev.event_type === 'bridal' ? 'badge-pink' : 'badge-blue'}">${ev.event_type}</span></td>
              <td><code style="font-family:var(--font-heading);font-weight:700;letter-spacing:0.1em;font-size:1rem">${ev.room_code}</code></td>
              <td><span class="badge ${ev.status === 'active' ? 'badge-green' : ev.status === 'finished' ? 'badge-yellow' : 'badge-blue'}">${ev.status}</span></td>
              <td style="color:var(--gray);font-size:0.85rem">${new Date(ev.created_at).toLocaleDateString()}</td>
              <td>
                ${ev.status !== 'finished' ? `<a href="/admin/control.html?room=${ev.room_code}" class="btn btn-sm btn-primary">Host 🎮</a>` : ''}
              </td>
            </tr>
          `).join('')}
          </tbody>
        </table>`;
      } catch (e) {
        console.error(e);
      }
    }

    function escHtml(str) {
      const d = document.createElement('div'); d.textContent = str; return d.innerHTML;
    }
    function logout() {
      localStorage.removeItem('k4_admin_token');
      window.location.href = '/admin/login.html';
    }
    loadDashboard();
  </script>
</body>
</html>
