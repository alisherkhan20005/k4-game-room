<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Login — K4 Game Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
  <style>
    body {
      background: linear-gradient(160deg,#0D0D1A 0%,#1A0A2E 50%,#0A1A2E 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:2rem 1rem;
    }
    .bg-orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none;}
    .orb-1{width:400px;height:400px;background:rgba(255,107,157,0.15);top:-100px;right:-100px;}
    .orb-2{width:350px;height:350px;background:rgba(155,127,212,0.12);bottom:-100px;left:-100px;}

    .login-card {
      position:relative;z-index:1;
      background:rgba(255,255,255,0.05);
      backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:28px;
      padding:3rem 2.5rem;
      width:100%;max-width:420px;
      box-shadow:0 40px 100px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.08);
      text-align:center;
    }
    .login-logo {
      width:72px;height:72px;
      background:var(--grad-primary);
      border-radius:20px;
      display:flex;align-items:center;justify-content:center;
      font-size:2rem;
      margin:0 auto 1.5rem;
      box-shadow:var(--shadow-pink);
    }
    .login-title { font-family:var(--font-display);font-size:2rem;font-weight:900;color:var(--white);margin-bottom:0.3rem; }
    .login-sub   { font-size:0.85rem;color:rgba(255,255,255,0.35);margin-bottom:2.5rem; }

    .dark-label {
      display:block;text-align:left;
      font-size:0.72rem;font-weight:700;
      color:rgba(255,255,255,0.35);
      text-transform:uppercase;letter-spacing:0.1em;
      margin-bottom:0.5rem;
    }
    .dark-input {
      width:100%;padding:1rem 1.25rem;
      background:rgba(255,255,255,0.06);
      border:1.5px solid rgba(255,255,255,0.1);
      border-radius:var(--r-md);
      color:var(--white);font-family:var(--font-body);font-size:0.95rem;
      outline:none;transition:all var(--t-base);
      margin-bottom:1.5rem;
    }
    .dark-input:focus{border-color:rgba(255,107,157,0.5);background:rgba(255,107,157,0.06);box-shadow:0 0 0 3px rgba(255,107,157,0.1);}
    .dark-input::placeholder{color:rgba(255,255,255,0.2);}

    .back-link {
      display:inline-flex;align-items:center;gap:0.4rem;
      margin-top:1.5rem;font-size:0.82rem;
      color:rgba(255,255,255,0.3);
      transition:color var(--t-fast);
    }
    .back-link:hover{color:rgba(255,255,255,0.6);}
  </style>
</head>
<body>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div class="login-card fade-in-up">
  <div class="login-logo">🎛️</div>
  <h1 class="login-title">Host Login</h1>
  <p class="login-sub">K4 Game Room Admin Panel</p>

  <div style="text-align:left">
    <label class="dark-label">Admin Password</label>
    <input type="password" class="dark-input" id="pwInput"
      placeholder="Enter your password" autocomplete="current-password">
  </div>

  <button class="btn btn-primary btn-full btn-xl" id="loginBtn" onclick="doLogin()">
    🎮 Login as Host
  </button>

  <a href="/" class="back-link">← Back to Player Join</a>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="/js/app.js"></script>
<script>
  if(K4App.getAdminToken()) window.location.href='/admin/dashboard.html';
  document.getElementById('pwInput').addEventListener('keypress', e=>{ if(e.key==='Enter') doLogin(); });

  async function doLogin() {
    const pw = document.getElementById('pwInput').value;
    const btn = document.getElementById('loginBtn');
    if(!pw) { K4App.toast('Enter your password','error'); return; }
    btn.disabled=true; btn.textContent='Logging in...';
    try {
      const data = await K4App.api('/admin/login',{method:'POST',body:{password:pw}});
      K4App.setAdminToken(data.token);
      window.location.href='/admin/dashboard.html';
    } catch(err) {
      K4App.toast(err.message||'Invalid password','error');
      btn.disabled=false; btn.textContent='🎮 Login as Host';
    }
  }
</script>
</body>
</html>
