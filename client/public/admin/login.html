<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Host Login — K4 Game Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body class="admin-login-body">
  <div class="alb-shape s1"></div>
  <div class="alb-shape s2"></div>

  <div class="al-card">
    <div class="al-header">
      <div class="al-logo">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <path d="M8 21h8M12 17v4"/>
        </svg>
      </div>
      <h1 class="al-title">Host Login</h1>
      <p class="al-sub">K4 Game Room — Admin Panel</p>
    </div>

    <div class="af-group">
      <label class="af-label">Admin Password</label>
      <input type="password" class="af-input" id="pwInput"
        placeholder="Enter your password" autocomplete="current-password">
    </div>

    <button class="btn btn-primary btn-full" id="loginBtn" onclick="doLogin()">
      Login as Host
    </button>

    <div class="al-footer">
      <a href="/" class="al-back">Back to Player Join</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (K4App.getAdminToken()) {
      K4App.api('/admin/verify').then(() => window.location.href='/admin/dashboard.html').catch(() => {});
    }
    document.getElementById('pwInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const pw  = document.getElementById('pwInput').value;
      const btn = document.getElementById('loginBtn');
      if (!pw) { K4App.toast('Enter your password','error'); return; }
      btn.disabled = true; btn.textContent = 'Logging in...';
      try {
        const data = await K4App.api('/admin/login',{method:'POST',body:{password:pw}});
        K4App.setAdminToken(data.token);
        window.location.href = '/admin/dashboard.html';
      } catch(err) {
        K4App.toast(err.message || 'Invalid password','error');
        btn.disabled = false; btn.textContent = 'Login as Host';
      }
    }
  </script>
</body>
</html>
