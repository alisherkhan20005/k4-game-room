<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — K4 Game Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
  <style>
    .login-page { min-height:100vh; background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); display:flex; align-items:center; justify-content:center; padding:2rem 1rem; }
    .login-card { background:rgba(255,255,255,0.05); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); border-radius:var(--radius-xl); padding:2.5rem 2rem; width:100%; max-width:400px; }
    .login-logo { text-align:center; margin-bottom:2rem; }
    .login-icon { width:70px; height:70px; background:linear-gradient(135deg,var(--baby-pink),var(--lavender)); border-radius:var(--radius-lg); display:flex; align-items:center; justify-content:center; font-size:2rem; margin:0 auto 1rem; box-shadow:0 8px 30px rgba(255,181,200,0.3); }
    .login-title { font-family:var(--font-heading); font-size:1.8rem; color:white; margin-bottom:0.25rem; }
    .login-sub { color:rgba(255,255,255,0.5); font-size:0.875rem; }
    .login-form-label { color:rgba(255,255,255,0.7); font-size:0.875rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; }
    .login-input { background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.2); color:white; }
    .login-input::placeholder { color:rgba(255,255,255,0.3); }
    .login-input:focus { border-color:var(--baby-pink); box-shadow:0 0 0 3px rgba(255,181,200,0.2); background:rgba(255,255,255,0.12); }
    .back-link { text-align:center; margin-top:1.25rem; }
    .back-link a { color:rgba(255,255,255,0.5); font-size:0.875rem; text-decoration:none; }
    .back-link a:hover { color:var(--baby-pink); }
    .error-msg { background:rgba(255,107,107,0.15); border:1px solid rgba(255,107,107,0.3); color:#FF6B6B; border-radius:var(--radius-md); padding:0.75rem 1rem; font-size:0.875rem; margin-bottom:1rem; display:none; }
  </style>
</head>
<body>
<div class="login-page">
  <div class="login-card fade-in-up">
    <div class="login-logo">
      <div class="login-icon">🎛️</div>
      <div class="login-title">Host Login</div>
      <div class="login-sub">K4 Game Room Admin</div>
    </div>
    <div class="error-msg" id="errorMsg">Invalid password. Please try again.</div>
    <div class="form-group">
      <label class="form-label login-form-label">Admin Password</label>
      <input type="password" class="form-input login-input" id="passwordInput" placeholder="Enter admin password" autocomplete="current-password">
    </div>
    <button class="btn btn-primary btn-full btn-lg" id="loginBtn" onclick="doLogin()">Login to Dashboard</button>
    <div class="back-link"><a href="/">← Back to Player Join</a></div>
  </div>
</div>
<script>
  // If already logged in, redirect
  if (localStorage.getItem('k4_admin_token')) {
    window.location.href = '/admin/dashboard.html';
  }

  document.getElementById('passwordInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') doLogin();
  });

  async function doLogin() {
    const password = document.getElementById('passwordInput').value;
    if (!password) return;
    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    try {
      const res = await fetch('/api/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password })
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('k4_admin_token', data.token);
        window.location.href = '/admin/dashboard.html';
      } else {
        document.getElementById('errorMsg').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Login to Dashboard';
      }
    } catch (e) {
      document.getElementById('errorMsg').textContent = 'Connection error. Is the server running?';
      document.getElementById('errorMsg').style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Login to Dashboard';
    }
  }
</script>
</body>
</html>
