<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Playing — K4 Game Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/games/games.css">
</head>
<body>

<div class="game-shell">

  <!-- Topbar -->
  <div class="game-topbar">
    <div class="topbar-avatar" id="playerAvatar" style="background:var(--pink)">P</div>
    <div style="flex:1;min-width:0">
      <div class="topbar-game-name" id="gameNameText">Loading...</div>
      <div class="topbar-game-sub">Q <span id="qNum">-</span></div>
    </div>
    <div class="topbar-score-wrap">
      <span class="topbar-score-label">Score</span>
      <span class="topbar-score-value" id="currentScore">0</span>
    </div>
  </div>

  <!-- Progress bar -->
  <div class="game-progress">
    <div class="game-progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <!-- Game content -->
  <div class="game-body">
    <div id="gameContent" style="width:100%;display:flex;flex-direction:column;align-items:center">
      <div class="waiting-screen">
        <div class="waiting-title">Get Ready!</div>
        <div class="waiting-sub">Waiting for host to start the game...</div>
        <div class="waiting-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>

</div>

<!-- Interim Leaderboard -->
<div class="lb-overlay" id="leaderboardOverlay">
  <div class="lb-header">
    <div class="lb-trophy">🏆</div>
    <h2 class="lb-title">Leaderboard</h2>
    <p class="lb-sub" id="lbSubtitle">After this game</p>
  </div>
  <div class="lb-list" id="leaderboardList"></div>
  <div class="lb-waiting">
    <div style="display:flex;gap:5px">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--pink);animation:dotPulse 1.4s ease-in-out infinite;display:inline-block"></span>
      <span style="width:6px;height:6px;border-radius:50%;background:var(--lavender);animation:dotPulse 1.4s ease-in-out 0.2s infinite;display:inline-block"></span>
      <span style="width:6px;height:6px;border-radius:50%;background:var(--mint);animation:dotPulse 1.4s ease-in-out 0.4s infinite;display:inline-block"></span>
    </div>
    Waiting for next game...
  </div>
</div>

<!-- Final Results -->
<div class="final-overlay" id="finalResults">
  <div class="final-emoji">🎉</div>
  <h1 class="final-title">That's a Wrap!</h1>
  <p class="final-sub">Thanks for playing K4 Game Room</p>
  <div class="podium-stage" id="podiumContainer"></div>
  <div class="lb-list" id="finalLeaderboard" style="max-width:500px;width:100%"></div>
  <p class="final-powered">Powered by <span>Kreate 4</span></p>
</div>

<!-- Confetti -->
<div id="confettiContainer" style="position:fixed;inset:0;pointer-events:none;z-index:9998;overflow:hidden"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script src="/js/animations.js"></script>
<script src="/js/leaderboard.js"></script>
<script src="/js/games/who-knows-best.js"></script>
<script src="/js/games/emojinary.js"></script>
<script src="/js/games/price-check.js"></script>
<script src="/js/games/first-impressions.js"></script>
<script src="/js/games/word-scramble.js"></script>
<script src="/js/app-game.js"></script>
</body>
</html>
