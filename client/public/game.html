<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Playing — K4 Game Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
  <link rel="stylesheet" href="/css/games/games.css">
</head>
<body>

<div class="game-shell" id="gameShell">

  <!-- Top Bar -->
  <div class="game-topbar">
    <div class="avatar avatar-sm" id="playerAvatar" style="background:var(--pink)">P</div>
    <div class="topbar-game-name" id="gameName">
      <span id="gameNameText">Loading...</span>
    </div>
    <div class="topbar-score">
      <span class="topbar-score-label">Score</span>
      <span class="topbar-score-value" id="currentScore">0</span>
    </div>
  </div>

  <!-- Progress Bar -->
  <div class="game-progress">
    <div class="game-progress-fill" id="progressFill" style="width:0%"></div>
  </div>

  <!-- Game Content -->
  <div class="game-body" id="gameContent">
    <div class="waiting-screen">
      <div class="waiting-icon">🎮</div>
      <h2 class="waiting-title">Loading Game...</h2>
      <div class="waiting-dots">
        <div class="waiting-dot"></div>
        <div class="waiting-dot"></div>
        <div class="waiting-dot"></div>
      </div>
    </div>
  </div>

</div>

<!-- Interim Leaderboard -->
<div class="lb-overlay" id="leaderboardOverlay">
  <div class="lb-header">
    <div class="lb-trophy">🏆</div>
    <h2 class="lb-title">Leaderboard</h2>
    <p class="lb-sub" id="lbSubtitle">After this round</p>
  </div>
  <div class="lb-list" id="leaderboardList"></div>
  <div class="lb-waiting" style="margin-top:2rem">
    <div style="display:flex;gap:5px">
      <div class="waiting-dot"></div>
      <div class="waiting-dot"></div>
      <div class="waiting-dot"></div>
    </div>
    Waiting for host to start next game...
  </div>
</div>

<!-- Final Results -->
<div class="final-overlay" id="finalResults">
  <div class="final-emoji">🎉</div>
  <h1 class="final-title">That's a Wrap!</h1>
  <p class="final-sub">Thanks for playing K4 Game Room</p>
  <div class="podium-stage" id="podiumContainer"></div>
  <div class="lb-list" id="finalLeaderboard" style="max-width:520px;width:100%"></div>
  <p class="final-powered">Powered by Kreate 4 🌸</p>
</div>

<!-- Confetti layer -->
<div id="confettiContainer" style="position:fixed;inset:0;pointer-events:none;z-index:9998"></div>
<div class="toast-container" id="toastContainer"></div>

<!-- Scripts in correct order -->
<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script src="/js/socket.js"></script>
<script src="/js/animations.js"></script>
<script src="/js/leaderboard.js"></script>
<script src="/js/games/who-knows-best.js"></script>
<script src="/js/games/emojinary.js"></script>
<script src="/js/games/price-check.js"></script>
<script src="/js/games/first-impressions.js"></script>
<script src="/js/games/word-scramble.js"></script>
<script src="/js/app-game.js"></script>
</body>
</html>
