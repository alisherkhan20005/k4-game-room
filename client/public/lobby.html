<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waiting Room — K4 Game Room</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900&family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
  <style>
    body {
      background: linear-gradient(160deg, #0D0D1A 0%, #1A0A2E 50%, #0A1A2E 100%);
      min-height: 100vh;
      color: var(--white);
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); pointer-events: none; z-index: 0;
    }
    .orb-1 { width:400px;height:400px;background:rgba(255,107,157,0.12);top:-100px;right:-100px; }
    .orb-2 { width:350px;height:350px;background:rgba(107,158,255,0.10);bottom:-100px;left:-100px; }

    .lobby-wrap {
      position: relative; z-index: 1;
      max-width: 680px; margin: 0 auto;
      padding: 2rem 1rem;
    }

    /* Top nav */
    .lobby-nav {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 2.5rem;
    }
    .lobby-brand {
      display: flex; align-items: center; gap: 0.75rem;
      font-family: var(--font-display); font-size: 1.1rem; font-weight: 700;
    }
    .brand-dot {
      width: 36px; height: 36px;
      background: var(--grad-primary); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }

    /* Hero area */
    .lobby-hero {
      text-align: center;
      margin-bottom: 2rem;
    }
    .lobby-event-badge {
      display: inline-flex; align-items: center; gap: 0.5rem;
      background: rgba(255,107,157,0.12);
      border: 1px solid rgba(255,107,157,0.2);
      border-radius: var(--r-full);
      padding: 0.35rem 1rem;
      font-size: 0.78rem; font-weight: 700;
      color: var(--pink-l);
      text-transform: uppercase; letter-spacing: 0.08em;
      margin-bottom: 1.25rem;
    }
    .lobby-title {
      font-family: var(--font-display);
      font-size: clamp(1.8rem,5vw,2.8rem);
      font-weight: 900; line-height: 1.1;
      margin-bottom: 0.5rem;
    }
    .lobby-celebrant { color: rgba(255,255,255,0.5); font-size: 0.95rem; }
    .lobby-celebrant strong { color: var(--pink); font-weight: 700; }

    /* Room code card */
    .room-code-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--r-xl);
      padding: 1.75rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .rc-label {
      font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.12em;
      color: rgba(255,255,255,0.3); font-weight: 600; margin-bottom: 0.75rem;
    }
    .rc-value {
      font-family: var(--font-display);
      font-size: clamp(2.5rem,7vw,4rem);
      font-weight: 900; letter-spacing: 0.35em;
      background: var(--grad-primary);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.875rem;
    }
    .rc-waiting {
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      color: rgba(255,255,255,0.35); font-size: 0.82rem;
    }
    .waiting-dots-wrap { display: flex; gap: 5px; }
    .w-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--pink);
      animation: dotPulse 1.4s ease-in-out infinite;
    }
    .w-dot:nth-child(2) { animation-delay:0.2s; background:var(--lavender); }
    .w-dot:nth-child(3) { animation-delay:0.4s; background:var(--mint); }
    @keyframes dotPulse { 0%,80%,100%{transform:scale(0.7);opacity:0.4} 40%{transform:scale(1.2);opacity:1} }

    /* Players section */
    .players-section {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: var(--r-xl);
      padding: 1.5rem;
    }
    .players-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.25rem;
    }
    .players-head-title {
      font-family: var(--font-display); font-size: 1.1rem; font-weight: 700;
    }
    .player-count-badge {
      background: rgba(255,107,157,0.12);
      border: 1px solid rgba(255,107,157,0.2);
      border-radius: var(--r-full);
      padding: 0.25rem 0.75rem;
      font-size: 0.75rem; font-weight: 700;
      color: var(--pink-l);
    }
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 0.75rem;
    }
    .player-chip {
      display: flex; flex-direction: column; align-items: center;
      gap: 0.5rem; padding: 1rem 0.5rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: var(--r-md);
      text-align: center;
      animation: bounceIn 0.4s cubic-bezier(0.34,1.56,0.64,1);
      transition: all var(--t-base);
    }
    .player-chip:hover { background: rgba(255,255,255,0.07); }
    .player-chip.me {
      border-color: rgba(255,107,157,0.3);
      background: rgba(255,107,157,0.08);
    }
    .chip-name {
      font-size: 0.78rem; font-weight: 600;
      max-width: 100%; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      color: rgba(255,255,255,0.8);
    }
    .chip-you {
      font-size: 0.62rem; color: var(--pink);
      font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    }
    .chip-pts {
      font-size: 0.7rem; color: rgba(255,255,255,0.3);
    }

    /* Game starting overlay */
    .game-starting {
      position: fixed; inset: 0;
      background: rgba(13,13,26,0.95);
      backdrop-filter: blur(20px);
      z-index: 1000;
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 1.5rem; text-align: center;
    }
    .game-starting.active { display: flex; animation: fadeIn 0.3s ease; }
    .gs-icon { font-size: 5rem; animation: bounceIn 0.6s cubic-bezier(0.34,1.56,0.64,1); }
    .gs-title { font-family: var(--font-display); font-size: 2.5rem; font-weight: 900; }
    .gs-sub   { color: rgba(255,255,255,0.45); }
  </style>
</head>
<body>
<div class="bg-orb orb-1"></div>
<div class="bg-orb orb-2"></div>

<div class="lobby-wrap">
  <!-- Nav -->
  <nav class="lobby-nav fade-in">
    <div class="lobby-brand">
      <div class="brand-dot">🎮</div>
      K4 Game Room
    </div>
    <div id="eventBadge" class="lobby-event-badge">💍 Bridal Shower</div>
  </nav>

  <!-- Hero -->
  <div class="lobby-hero fade-in-up">
    <h1 class="lobby-title">You're in! 🎉</h1>
    <p class="lobby-celebrant">Get ready to play for <strong id="celebrantName">the celebrant</strong></p>
  </div>

  <!-- Room Code -->
  <div class="room-code-card fade-in-up" style="animation-delay:0.1s">
    <div class="rc-label">Your Room Code</div>
    <div class="rc-value" id="roomCodeDisplay">------</div>
    <div class="rc-waiting">
      <div class="waiting-dots-wrap">
        <div class="w-dot"></div>
        <div class="w-dot"></div>
        <div class="w-dot"></div>
      </div>
      Waiting for host to start a game...
    </div>
  </div>

  <!-- Players -->
  <div class="players-section fade-in-up" style="animation-delay:0.2s">
    <div class="players-head">
      <div class="players-head-title">Players Joined 🎮</div>
      <div class="player-count-badge" id="playerCount">0 online</div>
    </div>
    <div class="players-grid" id="playersGrid">
      <div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,0.25);padding:1.5rem;font-size:0.85rem">
        Waiting for players to join...
      </div>
    </div>
  </div>
</div>

<!-- Game Starting Overlay -->
<div class="game-starting" id="gameStarting">
  <div class="gs-icon">🚀</div>
  <h2 class="gs-title">Game Starting!</h2>
  <p class="gs-sub">Get ready... Loading in 2 seconds</p>
  <div class="spinner"></div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/app.js"></script>
<script>
  const playerData = JSON.parse(sessionStorage.getItem('k4_player') || '{}');
  if (!playerData.player_id) window.location.href = '/';

  // Set UI
  document.getElementById('roomCodeDisplay').textContent = playerData.room_code || '------';
  document.getElementById('celebrantName').textContent = playerData.celebrant_name || 'the celebrant';
  const badge = document.getElementById('eventBadge');
  badge.textContent = playerData.event_type === 'baby' ? '👶 Baby Shower' : '💍 Bridal Shower';

  // Socket
  const socket = io();
  socket.on('connect', () => {
    socket.emit('join_room', {
      room_code: playerData.room_code,
      player_id: playerData.player_id,
      player_name: playerData.player_name
    });
  });

  socket.on('players_updated', ({ players }) => {
    const grid = document.getElementById('playersGrid');
    const badge = document.getElementById('playerCount');
    badge.textContent = `${players.length} online`;

    if (players.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:rgba(255,255,255,0.25);padding:1.5rem;font-size:0.85rem">Waiting for players...</div>`;
      return;
    }

    grid.innerHTML = players.map(p => {
      const isMe = p.id === playerData.player_id;
      const initials = p.name.charAt(0).toUpperCase();
      return `
        <div class="player-chip ${isMe ? 'me' : ''}">
          <div class="avatar avatar-md" style="background:${p.avatar_color}">${initials}</div>
          <span class="chip-name">${escHtml(p.name)}</span>
          ${isMe ? '<span class="chip-you">You</span>' : '<span class="chip-pts">Ready ✓</span>'}
        </div>
      `;
    }).join('');
  });

  socket.on('game_started', ({ game_name }) => {
    document.getElementById('gameStarting').classList.add('active');
    setTimeout(() => {
      window.location.href = `/game.html?game=${game_name}&room=${playerData.room_code}`;
    }, 2000);
  });

  function escHtml(str) {
    const d = document.createElement('div');
    d.textContent = str; return d.innerHTML;
  }
</script>
</body>
</html>
