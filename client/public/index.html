<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K4 Game Room — Kreate 4</title>
  <meta name="description" content="Interactive event games for bridal and baby showers by Kreate 4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/animations.css">
  <style>
    .home-bg {
      min-height: 100vh;
      background: linear-gradient(135deg, #FFF0F5 0%, #FFF8F0 50%, #F0F8FF 100%);
      position: relative;
      overflow: hidden;
    }
    .home-bg::before {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,181,200,0.25) 0%, transparent 70%);
      top: -100px; right: -100px;
    }
    .home-bg::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168,206,222,0.2) 0%, transparent 70%);
      bottom: -50px; left: -50px;
    }
    .home-content {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1rem;
      text-align: center;
    }
    .logo-area { margin-bottom: 2rem; }
    .logo-icon {
      width: 90px; height: 90px;
      background: linear-gradient(135deg, var(--baby-pink), var(--peach));
      border-radius: var(--radius-xl);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      margin: 0 auto 1rem;
      box-shadow: 0 8px 30px rgba(255,181,200,0.4);
    }
    .logo-title {
      font-family: var(--font-heading);
      font-size: clamp(2.5rem, 7vw, 4rem);
      background: linear-gradient(135deg, var(--baby-pink), var(--lavender));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 0.25rem;
    }
    .logo-sub {
      font-size: 0.9rem;
      color: var(--gray);
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .join-card {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(20px);
      border-radius: var(--radius-xl);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
      border: 1px solid rgba(255,255,255,0.8);
    }
    .join-card h2 {
      font-family: var(--font-heading);
      font-size: 1.6rem;
      color: var(--dark);
      margin-bottom: 0.5rem;
    }
    .join-card p {
      color: var(--gray);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .room-code-input {
      text-align: center;
      letter-spacing: 0.3em;
      font-size: 1.5rem;
      font-weight: 700;
      text-transform: uppercase;
      font-family: var(--font-heading);
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.5rem 0;
      color: var(--gray);
      font-size: 0.8rem;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .floating-elements {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .float-el {
      position: absolute;
      font-size: 1.5rem;
      opacity: 0.25;
      animation: floatEl var(--dur, 8s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    @keyframes floatEl {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }
  </style>
</head>
<body>
  <div class="home-bg">
    <div class="floating-elements">
      <span class="float-el" style="top:10%;left:5%;--dur:7s;--delay:0s">💍</span>
      <span class="float-el" style="top:20%;right:8%;--dur:9s;--delay:1s">🌸</span>
      <span class="float-el" style="top:60%;left:3%;--dur:8s;--delay:2s">✨</span>
      <span class="float-el" style="top:70%;right:5%;--dur:6s;--delay:0.5s">🎀</span>
      <span class="float-el" style="top:40%;left:8%;--dur:10s;--delay:1.5s">🌷</span>
      <span class="float-el" style="top:85%;left:15%;--dur:7s;--delay:3s">💐</span>
      <span class="float-el" style="top:15%;left:40%;--dur:11s;--delay:2s">⭐</span>
    </div>
    <div class="home-content">
      <div class="logo-area fade-in-down">
        <div class="logo-icon">🎮</div>
        <h1 class="logo-title">K4 Game Room</h1>
        <p class="logo-sub">by Kreate 4</p>
      </div>

      <div class="join-card fade-in-up" id="joinCard">
        <h2>Join the Fun! 🎉</h2>
        <p>Enter your room code and name to start playing</p>

        <div class="form-group">
          <label class="form-label">Room Code</label>
          <input
            type="text"
            class="form-input room-code-input"
            id="roomCodeInput"
            placeholder="ABC123"
            maxlength="6"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="characters"
          >
        </div>

        <div class="form-group">
          <label class="form-label">Your Name</label>
          <input
            type="text"
            class="form-input"
            id="playerNameInput"
            placeholder="Enter your name"
            maxlength="30"
            autocomplete="off"
          >
        </div>

        <button class="btn btn-primary btn-full btn-lg" id="joinBtn" onclick="joinGame()">
          Let's Play! 🎊
        </button>

        <div class="divider">or</div>

        <a href="/admin" class="btn btn-outline btn-full">
          🎛️ Host Login
        </a>
      </div>

      <!-- Loading State -->
      <div class="join-card fade-in-up hidden" id="loadingCard" style="text-align:center">
        <div class="spinner" style="margin:0 auto 1rem"></div>
        <p style="color:var(--gray)">Joining the game room...</p>
      </div>
    </div>
  </div>

  <!-- Toast Container -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/app.js"></script>
  <script>
    const roomInput = document.getElementById('roomCodeInput');
    const nameInput = document.getElementById('playerNameInput');

    // Auto uppercase room code
    roomInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    });

    // Enter key support
    nameInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') joinGame();
    });
    roomInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') nameInput.focus();
    });

    async function joinGame() {
      const roomCode = roomInput.value.trim();
      const playerName = nameInput.value.trim();

      if (!roomCode || roomCode.length < 6) {
        showToast('Please enter a 6-character room code', 'error');
        roomInput.focus();
        return;
      }

      if (!playerName) {
        showToast('Please enter your name', 'error');
        nameInput.focus();
        return;
      }

      document.getElementById('joinCard').classList.add('hidden');
      document.getElementById('loadingCard').classList.remove('hidden');

      try {
        const res = await fetch('/api/players/join', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ room_code: roomCode, player_name: playerName })
        });

        const data = await res.json();

        if (!data.success) {
          throw new Error(data.message);
        }

        // Save player info to session
        sessionStorage.setItem('k4_player', JSON.stringify(data.data));

        // Redirect to lobby
        window.location.href = '/lobby.html';

      } catch (err) {
        document.getElementById('joinCard').classList.remove('hidden');
        document.getElementById('loadingCard').classList.add('hidden');
        showToast(err.message || 'Could not join. Check your room code.', 'error');
      }
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const icons = { success: '✅', error: '❌', info: 'ℹ️' };
      toast.className = `toast toast-${type}`;
      toast.innerHTML = `<span>${icons[type]}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 4000);
    }
  </script>
</body>
</html>
